name: CI

# Every push and pull request runs the offline test suites and the
# offline half of the evaluation harness. Neither needs an API key, so
# the check is free, fast, and cannot be skipped by forgetting to run
# it locally.
#
# The AI half of the harness is deliberately NOT run here: it calls a
# paid API and its results vary between runs, which would make CI both
# expensive and flaky. It is run on demand before prompt or model
# changes ship — see evals/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt

      # Every tracked Python file, so new modules (the bot, scripts,
      # news pipeline) are covered without editing this list.
      - name: Check every source file parses
        run: git ls-files -z '*.py' | xargs -0 python -m compileall -q

      # Catches a broken import in a process entry point, which a
      # syntax check cannot see. Runs with no secrets set.
      - name: Check the bot and API entry points import
        run: python -c "import telegram_bot.main, api.main"

      - name: Run offline test suites
        run: python run_tests.py

      - name: Run offline evaluation (scanner and URL heuristics)
        run: python evals/runner.py

      # Reports precision/recall/F1/FPR on the held-out set, which no
      # rule is tuned on. Fails only on malformed data or overlap with
      # the tuning corpus, never on a score: a threshold would make the
      # held-out set a tuning target.
      - name: Run held-out evaluation (reported, not gated on scores)
        run: python evals/heldout_runner.py
