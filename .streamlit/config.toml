# Tumar.AI theme — "Midnight Aurora" design system.
# Streamlit reads this file automatically on startup.
# Fine-grained styling lives in assets/styles.css.

[theme]
base = "dark"
primaryColor = "#397BFF"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#0D1220"
textColor = "#F8FAFC"
linkColor = "#8FB4FF"
borderColor = "#263249"
baseRadius = "12px"

[server]
# Uploads above this are refused by Streamlit before they reach the
# image validator (which enforces its own, configurable 6 MiB limit).
maxUploadSize = 8
